name: Monitoreo Dique La Quebrada

# Cada 10 minutos: lee pluviómetros, nivel del dique, sensores del río y celdas de tormenta (OHMC/APRHI),
# calcula la alerta, avisa por ntfy si sube y publica el sitio con los datos actualizados.
#
# Los horarios programados de GitHub ("schedule") se demoran o se saltean, así que cada corrida
# espera hasta la próxima marca de 10 minutos y se vuelve a lanzar sola (workflow_dispatch con el
# token propio del repositorio). El "schedule" queda como respaldo para reiniciar la cadena si se corta.
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: monitor-pages
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      espera: ${{ steps.cadencia.outputs.espera }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Leer estaciones y evaluar alerta
        run: node monitor/run.js
        env:
          ORUS_USUARIO: ${{ secrets.ORUS_USUARIO }}
          ORUS_CLAVE: ${{ secrets.ORUS_CLAVE }}
          ORUS_ESTACION: ${{ vars.ORUS_ESTACION || secrets.ORUS_ESTACION }}
      # Cadencia adaptativa: con amenaza activa se vuelve a leer cada 2–5 min en lugar de cada 10
      - name: Calcular la próxima espera
        id: cadencia
        if: always()
        run: |
          s=$(node -e 'try{const e=require("./data/estado.json");const o=Math.max((e.evacuacion&&e.evacuacion.ordenMax)||0,(e.alerta&&e.alerta.orden||0)>=2?2:0);console.log(o>=3?120:o>=2?150:o>=1?300:0)}catch(x){console.log(0)}')
          echo "espera=$s" >> "$GITHUB_OUTPUT"
          echo "Próxima espera: $s s (0 = marca de 10 min)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar sitio
        id: deploy
        uses: actions/deploy-pages@v4

  siguiente:
    needs: monitor
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Esperar (2–5 min con amenaza activa, si no hasta la próxima marca de 10 min)
        env:
          ESPERA: ${{ needs.monitor.outputs.espera }}
        run: |
          if [ -n "$ESPERA" ] && [ "$ESPERA" -gt 0 ] 2>/dev/null; then
            wait=$ESPERA
          else
            now=$(date +%s)
            next=$(( (now / 600 + 1) * 600 ))
            wait=$(( next - now - 60 ))
            if [ $wait -lt 30 ]; then wait=$(( wait + 600 )); fi
          fi
          echo "Esperando $wait segundos"
          sleep $wait
      - name: Lanzar la próxima corrida
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --repo "$GITHUB_REPOSITORY" --ref main
